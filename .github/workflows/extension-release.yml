name: Build and release browser extensions

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'extension/**'
      - 'scripts/**'
      - 'src/test/**'
      - '.github/workflows/extension-release.yml'

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - name: Test extension rules
        run: bunx vitest run src/test/creator-classification.test.ts src/test/text-check.test.ts src/test/text-extraction.test.ts src/test/youtube-disclosure.test.ts src/test/browser-manifest.test.ts
      - name: Install model build dependencies
        run: bash scripts/build-extension.sh deps
      - name: Build pinned offline model
        run: bash scripts/build-extension.sh model
      - name: Bundle full extension
        run: bash scripts/build-extension.sh pack
      - name: Create browser packages
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/package-browsers.mjs
      - name: Validate archives and write checksums
        run: |
          python3 scripts/verify-extension.py /tmp/air-release/*.zip
          cd /tmp/air-release
          sha256sum -- *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: |
            /tmp/air-release/*.zip
            /tmp/air-release/SHA256SUMS.txt
          if-no-files-found: error

  safari:
    needs: packages
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-packages
          path: ${{ runner.temp }}/packages
      - name: Convert to Safari Xcode project (unsigned)
        run: |
          xcrun safari-web-extension-converter --help
          unzip -q "$RUNNER_TEMP/packages/ai-video-radar-safari.zip" -d "$RUNNER_TEMP/safari-source"
          xcrun safari-web-extension-converter "$RUNNER_TEMP/safari-source" --project-location "$RUNNER_TEMP/safari-project" --app-name "AI Video Radar" --bundle-identifier "com.aivideoradar.extension" --swift --no-open --no-prompt --copy-resources
          ditto -c -k --keepParent "$RUNNER_TEMP/safari-project" "$RUNNER_TEMP/ai-video-radar-safari-xcode.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: safari-xcode-project
          path: ${{ runner.temp }}/ai-video-radar-safari-xcode.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [packages, safari]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - name: Publish downloadable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "AI Video Radar $TAG" --notes "Full offline browser packages. Chromium: unpacked install or store submission. Firefox: unsigned ZIP for AMO signing, not a normal-install XPI. Safari: unsigned Xcode project; Apple signing and App Store submission required. AI guesses are not proof; store approval and browser compatibility are not guaranteed."
          fi
          gh release upload "$TAG" release/* --clobber